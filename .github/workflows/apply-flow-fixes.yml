name: Apply UI and Color Fixes to Triada Polaris

'on':
  push:
    paths:
      - '.github/workflows/apply-flow-fixes.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update LandingPage.tsx
        run: |
          echo "" | base64 -d | python3

      - name: Verify build compiles
        run: |
          npm ci
          npm run build

      - name: Commit and push changes
        run: |
          git config user.name "Cristian Dicen"
          git config user.email "cristian2200299@gmail.com"
          git add src/pages/LandingPage.tsx
          git rm -f color_report.txt .github/workflows/apply-flow-fixes.yml || true
          git commit -m "fix(landing): corregir color verde WhatsApp en Flow, nowrap en titulos y badges, y botones CTA en una linea"
          git push origin main
