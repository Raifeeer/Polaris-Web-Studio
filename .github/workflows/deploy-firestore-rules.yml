name: Deploy Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firebase.json"

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools
      - name: Escribir credenciales temporales
        run: echo '${{ secrets.FIREBASE_RULES_SA_KEY }}' > /tmp/firebase-rules-sa.json
      - name: Desplegar reglas de Firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-rules-sa.json
        run: firebase deploy --only firestore:rules --project gen-lang-client-0746441136
      - name: Limpiar credenciales
        if: always()
        run: rm -f /tmp/firebase-rules-sa.json
