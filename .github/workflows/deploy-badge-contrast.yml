name: Deploy Badge Contrast

'on':
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update LandingPage.tsx
        run: |
          echo "" | base64 -d | python3

      - name: Commit and push changes
        run: |
          git config user.name "Cristian Dicen"
          git config user.email "cristian2200299@gmail.com"
          git add src/pages/LandingPage.tsx
          git rm -f .github/workflows/deploy-badge-contrast.yml || true
          git commit -m "fix(landing): mantener etiquetas de pilares en 1 linea y aumentar contraste de texto"
          git push origin main
