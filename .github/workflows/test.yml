name: Upload Bank Logos and Update Checkout

on:
  push:
    paths:
      - '.github/workflows/apply-bank-logos.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Bank Logos and Component
        run: |
          mkdir -p public/brand
          cat << 'EOF' > /tmp/deploy.py
          import base64
          pop_b64 = '''$(cat /mnt/agentdata/gcs/c_4d2a108d622dcc4e/pop_b64.txt)'''
          bhd_b64 = '''$(cat /mnt/agentdata/gcs/c_4d2a108d622dcc4e/bhd_b64.txt)'''
          EOF
