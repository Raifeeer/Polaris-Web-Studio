name: Apply Triada Polaris

'on':
  push:
    paths:
      - '.github/workflows/apply-triada.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update LandingPage.tsx
        run: |
          echo "" | base64 -d | python3

      - name: Verify build compiles
        run: |
          npm ci
          npm run build

      - name: Commit and push changes
        run: |
          git config user.name "Cristian Dicen"
          git config user.email "cristian2200299@gmail.com"
          git add src/pages/LandingPage.tsx
          git rm .github/workflows/apply-triada.yml
          git commit -m "feat(landing): implementar La Tríada Polaris con 3 pilares equilibrados y banner de sinergia"
          git push origin main
