name: Apply Payment Gateways Copy

on:
  push:
    paths:
      - '.github/workflows/apply-pricing-payment.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Update Script
        run: |
          echo "" | base64 -d | python3

      - name: Verify build compiles
        run: |
          npm ci
          npm run build

      - name: Commit and push
        run: |
          git config user.name "Cristian Dicen"
          git config user.email "cristian2200299@gmail.com"
          git commit -am "feat(payments): anadir pasarelas dominicanas Azul y CardNET junto a PayPal y Stripe"
          git push origin main
