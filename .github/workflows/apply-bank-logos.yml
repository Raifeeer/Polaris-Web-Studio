name: Upload Bank Logos and Update Checkout

on:
  push:
    paths:
      - '.github/workflows/apply-bank-logos.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Bank Logos and Component
        run: |
          mkdir -p public/brand
          python3 -c "
          import base64
          with open('/tmp/script.py', 'w') as f:
              f.write('ready')
          "
