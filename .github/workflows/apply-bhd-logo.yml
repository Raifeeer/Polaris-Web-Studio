name: Upload BHD Logo

on:
  push:
    paths:
      - '.github/workflows/apply-bhd-logo.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy BHD Logo
        run: |
          mkdir -p public/brand
          echo "" | base64 -d > public/brand/banco-bhd.png
          git config user.name "Cristian Dicen"
          git config user.email "cristian2200299@gmail.com"
          git add public/brand/banco-bhd.png
          git commit -m "feat(branding): agregar logo oficial en PNG transparente de Banco BHD"
          git push origin main
