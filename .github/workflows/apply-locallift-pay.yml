name: Apply Local Lift Bank Transfer Payment

on:
  push:
    paths:
      - '.github/workflows/apply-locallift-pay.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update LocalLiftPay.tsx
        run: |
          python3 -c "
          import base64
          b64 = '''
          $(cat /working_dir/c_4d2a108d622dcc4e/new_locallift_pay.b64)
          '''
          with open('src/pages/LocalLiftPay.tsx', 'wb') as f:
              f.write(base64.b64decode(b64.strip()))
          "

      - name: Verify build compiles
        run: |
          npm ci
          npm run build

      - name: Commit and push
        run: |
          git config user.name "Cristian Dicen"
          git config user.email "cristian2200299@gmail.com"
          git commit -am "feat(payments): anadir opcion de transferencia bancaria dominicana (Popular, BHD, Qik) en checkout de Local Lift"
          git push origin main
