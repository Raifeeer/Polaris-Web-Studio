name: Deploy Popular PNG

on:
  push:
    paths:
      - '.github/workflows/deploy-popular.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write PNG
        run: |
          mkdir -p public/brand
          echo "\" | base64 -d > public/brand/banco-popular.png
          git config user.name "Cristian Dicen"
          git config user.email "cristian2200299@gmail.com"
          git add public/brand/banco-popular.png
          git commit -m "feat(branding): agregar banco-popular.png"
          git push origin main
