name: Check Flow Mark Details

'on':
  push:
    paths:
      - '.github/workflows/check-flow-mark.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inspect with python
        run: |
          python3 -c "
          from PIL import Image
          import os

          files = [
              'public/brand/polaris-flow-mark-official.png',
              'public/brand/polaris-flow-vertical-official.png',
              'public/brand/polaris-flow-vertical-dark-official.png',
              'brand-assets/explorations/polaris-flow-symbol-v2.png',
              'public/brand/local-lift-icon.png'
          ]
          res = {}
          for path in files:
              if os.path.exists(path):
                  im = Image.open(path)
                  res[path] = {'size': im.size, 'format': im.format, 'mode': im.mode}
              else:
                  res[path] = 'NOT FOUND'

          with open('flow_mark_check.json', 'w') as f:
              import json
              json.dump(res, f, indent=2)
          "
          git config user.name "Cristian Dicen"
          git config user.email "cristian2200299@gmail.com"
          git add flow_mark_check.json
          git rm .github/workflows/check-flow-mark.yml
          git commit -m "ci: inspect flow mark image dimensions"
          git push origin main
