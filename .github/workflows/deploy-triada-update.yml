name: Deploy Triada Update

'on':
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update LandingPage.tsx
        run: |
          python3 -c "import base64, zlib; open('src/pages/LandingPage.tsx', 'wb').write(zlib.decompress(base64.b64decode('$(cat << 'EOF'
$(python3 -c "import zlib, base64; print(base64.b64encode(zlib.compress(open('/working_dir/c_2437e1a031a0d52e/src/pages/LandingPage.tsx', 'rb').read(), 9)).decode('utf-8'))")
EOF
)')))"

      - name: Install and Build
        run: |
          npm ci
          npm run build

      - name: Commit and Push
        run: |
          git config user.name "Cristian Dicen"
          git config user.email "cristian2200299@gmail.com"
          git add src/pages/LandingPage.tsx
          git rm -f asset_report.json flow_mark_check.json .github/workflows/check-flow-mark.yml .github/workflows/apply-flow-orange.yml .github/workflows/deploy-triada-update.yml || true
          git commit -m "feat(landing): aplicar isotipos de marca y color naranja oficial a Polaris Flow"
          git push origin main
